services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      LibreOffice__ExecutablePath: /usr/bin/soffice
      LibreOffice__TimeoutSeconds: "180"
    volumes:
      - api_data:/app/App_Data
    # Host port chosen to avoid other apps on this VPS (see docker-compose.server.yml)
    ports:
      - "5010:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    # Do not use :80 — Apache already owns it on the shared VPS
    ports:
      - "3010:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_data:
